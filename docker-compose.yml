version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: riffado-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Default preserved for backward compat with existing self-host
      # deploys. The one-line installer (scripts/install.sh) generates a
      # random POSTGRES_PASSWORD and writes it to .env. Existing operators
      # can rotate by setting POSTGRES_PASSWORD in .env, recreating the
      # `db` volume, and restoring from a backup.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: riffado
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Pull the published image by default.
    #   - `latest`  → newest stable release (recommended)
    #   - `0.1.0`   → pin to a specific version
    #   - `dev`     → rolling build from `main` (unstable, opt-in)
    # Override via RIFFADO_VERSION in .env. For local builds, see docker-compose.dev.yml.
    image: ghcr.io/riffado/riffado:${RIFFADO_VERSION:-latest}
    container_name: riffado-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/riffado

      # Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-}
      SELF_HOST_MODE: ${SELF_HOST_MODE:-shared}
      # Organization scope (optional; both email and password enable it,
      # the email alone under single sign-on)
      ORG_ACCOUNT_EMAIL: ${ORG_ACCOUNT_EMAIL:-}
      ORG_ACCOUNT_PASSWORD: ${ORG_ACCOUNT_PASSWORD:-}
      ORG_ACCOUNT_NAME: ${ORG_ACCOUNT_NAME:-}
      # Single sign-on (optional; see docs/self-hosting/sso). With issuer,
      # client id and secret set, it is the only way to sign in.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_SESSION_MAX_AGE: ${OIDC_SESSION_MAX_AGE:-}
      # External MCP server (optional; see docs/self-hosting/mcp). Off
      # unless MCP_AUDIENCE is set; requires single sign-on above and uses
      # the same realm.
      MCP_AUDIENCE: ${MCP_AUDIENCE:-}
      MCP_ALLOWED_CLIENTS: ${MCP_ALLOWED_CLIENTS:-}
      MCP_AUDIT_RETENTION_DAYS: ${MCP_AUDIT_RETENTION_DAYS:-}
      # Inbound mail (optional; see mail-receiver/README.md). Off unless
      # MAIL_DOMAIN is set; requires single sign-on above, both secrets,
      # and the mail-receiver service (profile `mail`).
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      MAIL_ORG_NICKNAME: ${MAIL_ORG_NICKNAME:-}
      MAIL_FORMER_ORG_NICKNAMES: ${MAIL_FORMER_ORG_NICKNAMES:-}
      MAIL_ADDRESS_HASH_SECRET: ${MAIL_ADDRESS_HASH_SECRET:-}
      MAIL_INGEST_SECRET: ${MAIL_INGEST_SECRET:-}
      MAIL_MAX_SIGNATURE_AGE_HOURS: ${MAIL_MAX_SIGNATURE_AGE_HOURS:-}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-}
      MAIL_MAX_MESSAGE_MB: ${MAIL_MAX_MESSAGE_MB:-}
      MAIL_INACTIVE_DAYS: ${MAIL_INACTIVE_DAYS:-}

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Storage (optional defaults)
      DEFAULT_STORAGE_TYPE: ${DEFAULT_STORAGE_TYPE:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/audio}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Folder export destinations are always resolved beneath this fixed
      # container boundary. Operators choose only the host-side bind path.
      FILESYSTEM_EXPORT_ROOT: /exports
      # Google Drive export (optional; see docs/self-hosting/google-drive)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY:-}
      GOOGLE_CLOUD_PROJECT_NUMBER: ${GOOGLE_CLOUD_PROJECT_NUMBER:-}
      GOOGLE_WORKSPACE_DOMAINS: ${GOOGLE_WORKSPACE_DOMAINS:-}
      # Learn (optional; see docs/self-hosting/environment-variables)
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      LEARN_MCP_URL: ${LEARN_MCP_URL:-}
      LEARN_BRIDGE_URL: ${LEARN_BRIDGE_URL:-}
      KNOWLEDGE_MEMORY_MB: ${KNOWLEDGE_MEMORY_MB:-}

      # SMTP (optional: password reset + email notifications)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_MARKETING_FROM: ${SMTP_MARKETING_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
    volumes:
      # Official compose defaults LOCAL_STORAGE_PATH to /app/audio.
      # The app default without that override is ./storage → /app/storage
      # in this image (WORKDIR /app). Persist both so neither path is
      # wiped on container recreate.
      - audio:/app/audio
      - storage:/app/storage
      - ${FILESYSTEM_EXPORT_HOST_PATH:-./exports}:/exports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  # Optional. Serves an OpenAI-compatible `chat/completions` endpoint
  # backed by the Claude Code and Codex CLIs, so a *subscription* can
  # generate summaries instead of a metered API key. See
  # `agent-bridge/README.md`; opt in with `--profile agent-bridge`.
  #
  # Add it in Riffado under Settings -> AI Providers as the "Claude Code"
  # or "Codex" preset; both prefill http://agent-bridge:8787/v1 and take
  # BRIDGE_TOKEN as the API key.
  agent-bridge:
    profiles: ["agent-bridge"]
    build:
      context: ./agent-bridge
      args:
        # Pin these. See the note in agent-bridge/Dockerfile.
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        CODEX_VERSION: ${CODEX_VERSION:-latest}
    container_name: riffado-agent-bridge
    restart: unless-stopped
    # Reaps what a killed CLI leaves behind (npm's codex is a wrapper whose
    # real binary outlives it by a moment); node as PID 1 would not.
    init: true
    # Deliberately no `ports:`. The bridge spends your subscription, so
    # it is reachable only from other services on this compose network --
    # publishing it would expose that to the host and anything routed to
    # it. Riffado reaches it by service name.
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN}
      # From `claude setup-token`. Leave unset if you instead ran
      # `docker compose run --rm agent-bridge claude auth login`, which
      # writes a credential into the agent_creds volume below.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      BRIDGE_MAX_CONCURRENCY: ${BRIDGE_MAX_CONCURRENCY:-1}
      # Learn with tools can take several minutes on a long recording.
      BRIDGE_TIMEOUT_MS: ${BRIDGE_TIMEOUT_MS:-900000}
      # Learn's read-only knowledge tools on the app (see agent-bridge/README.md).
      BRIDGE_LEARN_MCP_URL: ${LEARN_MCP_URL:-}
      CLAUDE_EXTRA_ARGS: ${CLAUDE_EXTRA_ARGS:-}
      CODEX_EXTRA_ARGS: ${CODEX_EXTRA_ARGS:-}
    volumes:
      # Both CLIs refresh their own OAuth tokens in place, so this has to
      # be writable and survive recreates. It holds ~/.claude and
      # ~/.codex -- treat it as sensitive as the app's ENCRYPTION_KEY.
      - agent_creds:/home/node
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Optional. Inbound mail: an SMTP server for MAIL_DOMAIN that accepts mail
  # from Google's sending servers only, never relays and never sends, and
  # hands each message to the app (see mail-receiver/README.md). Opt in with
  # `--profile mail`. It holds no database credentials and no encryption
  # key. Port 25 is the deployment's to publish (an override mapping
  # "25:2525"); the base file binds the container to loopback only.
  mail-receiver:
    profiles: ["mail"]
    build:
      context: .
      dockerfile: mail-receiver/Dockerfile
    container_name: riffado-mail-receiver
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      # Messages are spooled here while they are checked, never on disk.
      - /spool:size=256m,mode=1777
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-}
      MAIL_INGEST_URL: http://app:3000
      MAIL_INGEST_SECRET: ${MAIL_INGEST_SECRET:-}
      MAIL_MAX_MESSAGE_MB: ${MAIL_MAX_MESSAGE_MB:-36}
      # `google` (Google's published sending ranges), CIDRs, or both.
      MAIL_ALLOWED_SOURCES: ${MAIL_ALLOWED_SOURCES:-google}
      MAIL_TLS_CERT_FILE: /tls/fullchain.pem
      MAIL_TLS_KEY_FILE: /tls/privkey.pem
    volumes:
      - ${MAIL_TLS_DIR:-./mail-tls}:/tls:ro
    ports:
      - "127.0.0.1:2525:2525"
    depends_on:
      app:
        condition: service_healthy

  # Optional. Embeddings for Learn: BAAI/bge-m3 served by Ollama on CPU,
  # about 1.3 GB of memory with the model loaded (Spike 0.2). Opt in with
  # `--profile learn`, then set in .env:
  #   EMBEDDING_BASE_URL=http://embeddings:11434/v1
  #   EMBEDDING_MODEL=bge-m3
  # The first start downloads the model (1.2 GB) into the volume below.
  embeddings:
    profiles: ["learn"]
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    container_name: riffado-embeddings
    restart: unless-stopped
    # Deliberately no `ports:`: only the app, by service name, needs it.
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      # Keep the model loaded between runs instead of loading it (about a
      # second) after five idle minutes.
      OLLAMA_KEEP_ALIVE: ${EMBEDDING_KEEP_ALIVE:-24h}
    # Serve, and pull the model once the server answers; a failed pull
    # (offline) leaves the service unhealthy and Learn matching words only.
    # An init process forwards `docker stop` to Ollama; if the server dies
    # before it answers, the container exits and is restarted.
    init: true
    entrypoint:
      - /bin/sh
      - -c
      - >-
        ollama serve & server=$$!;
        until ollama list >/dev/null 2>&1; do kill -0 $$server 2>/dev/null || exit 1; sleep 1; done;
        ollama pull "$$EMBEDDING_MODEL" || echo "could not pull the embedding model";
        wait $$server
    volumes:
      - embeddings:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$EMBEDDING_MODEL\" >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3

volumes:
  pgdata:
    driver: local
  audio:
    driver: local
  agent_creds:
    driver: local
  storage:
    driver: local
  embeddings:
    driver: local
